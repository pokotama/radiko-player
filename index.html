<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#c8243a">
    <title>radiko プレイヤー</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="app-bar">
      <h1>radiko プレイヤー</h1>
      <button id="signInButton" class="ghost-button" type="button">ログイン</button>
    </header>

    <main class="shell">
      <p class="status" id="status">Googleにログインしてください。</p>

      <section class="list" id="list"></section>
    </main>

    <!-- 再生中のバー（画面下に固定） -->
    <footer class="player" id="player" hidden>
      <div class="player-title" id="playerTitle"></div>
      <div class="seek-row">
        <output class="time" id="currentTime">00:00</output>
        <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="再生位置">
        <output class="time" id="durationTime">00:00</output>
      </div>
      <div class="transport">
        <button class="skip" data-skip="-15" type="button">-15</button>
        <button class="play" id="playButton" type="button">再生</button>
        <button class="skip" data-skip="30" type="button">+30</button>
      </div>
      <div class="rate-row">
        <label>速度 <input id="rate" type="range" min="0.5" max="2.5" step="0.05" value="1"></label>
        <output id="rateOut">1.00x</output>
      </div>
    </footer>

    <audio id="audio" preload="metadata"></audio>

    <script src="app.js"></script>
  </body>
</html>
